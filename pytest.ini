[pytest]
# The repo's OWN tests live in tests/ and nowhere else. suite/tasks/** holds task FIXTURES — seed
# and hidden pytest files that are copied into a task's throwaway workspace and run THERE, importing
# task-local packages (`orders`, `shipping`) that exist only in that workspace. Collected from the
# repo root they can only fail, and same-basename files (two test_rates.py) collide through stale
# bytecode, so whether they error depends on __pycache__ state — a green run and a red run on the
# same tree. Scope collection to the truth instead of the accident.
testpaths = tests
