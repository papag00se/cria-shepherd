# cria config — ONE format: [backends] (WHERE a model runs) + [roles] (HOW cria uses it).
# No secrets here — keys come from the environment; api_key_env names the var.

env_file = "~/.cria/.env"          # env file cria loads at startup (its secrets)

[server]
host = "127.0.0.1"
port = 18085                       # cria's port (fronts the model server)
heartbeat_seconds = 5              # SSE keepalive; 0 disables

[logging]
level = "info"                     # debug | info | warn | error (console filter)
dir = "~/.cria/logs"               # JSONL record dir
console = true
jsonl = true
capture_calls = false              # write exact per-call body to capture_dir
capture_dir = "~/.cria/calls"
capture_rendered = true            # also capture the template-rendered prompt

[indicators]
enabled = true                     # master switch for all cria decoration
connect = true                     # one-line banner on the first turn of a session
status = true                      # live status line while a turn is in flight
metrics = true                     # "· N tok/s" suffix
route = true                       # "⟦cria⟧ <role> · <model>" banner
assists = true                     # "⟦cria⟧ <note>" guard lines
stats = true                       # end-of-turn summary line
reasoning = true                   # forward thinking on native channel (transient)
reasoning_transcript = true        # also fold thinking into scrollback

[tools]
focus = true                       # curate menu to coding essentials
cheatsheet = true                  # inject per-tool usage note
# workspace_image_tool = "view_image"   # only when this deployment's harness has the native view_image(path)
                                   # tool; see docs/image-workflow.md

[safety]
# cria bounds the model to the workspace even if the harness runs --yolo (sandbox/approvals off) —
# a backstop for a fledgling, untrusted model. Governs FILE access outside the workspace:
external_dir_permission = "none"   # none = no external reads/writes | read = external reads only | write = unrestricted

[retention]
# cria keeps private state for multipart reads (~/.cria/multipart) and image sessions (~/.cria/images). No harness
# sends a trustworthy "conversation over" signal (measured against real Codex), so by default cria deletes NOTHING;
# the state grows until you run `python -m cria.retention list|prune [--older-than 14d] [--apply]`.
# auto_prune_after is YOUR standing instruction to delete: cria then removes retained state whose last touch is older
# than this, once at start and then every auto_prune_every, with exactly the safety of `prune --apply --older-than`.
# Choose an age longer than any conversation you will resume. Minimums: 1h and 1m. Unset = off.
# Full contract: docs/multipart-and-retention.md.
# auto_prune_after = "14d"
# auto_prune_every = "1h"

[context]
focus_trim = true                  # collapse duplicate tool calls
self_compact = true                # summarize the old history middle. WHEN is a predicate over the coder's measured
                                   # window, reserves and recent turn growth (selfcompact.view_room): there is no
                                   # size knob, and the old `trigger_compaction` key is a startup error.
satisfaction_check_start_minutes = 8    # level 5: first "whole task done?" check after N minutes of coder work
satisfaction_check_every_minutes = 4    # then every N minutes (0 disables). cria turns minutes into turns from its
                                        # own measured seconds per coder turn, clamped to the range below
satisfaction_check_min_turns = 5        # before any measurement the check is this many turns out
satisfaction_check_max_turns = 60

[planner]
enabled = false                    # opt-in experiment only; never enabled by L5
max_gather_rounds = 12             # cap the planner investigate loop

# Optional trained CPU classifier (needs `pip install cria-shepherd[system1]`: onnxruntime + tokenizers).
# When enabled it answers ONLY two closed questions in-process, with no reasoner call: whether a compaction
# briefing is retrospective (PLAN vs RETROSPECTIVE) and whether an authored directive dictates code
# (DICTATES vs DESCRIBES). Every other judgment stays with the reasoner. If it is enabled and the bundle or
# dependencies cannot load, cria refuses to start; if one call cannot be answered the optional steer or
# briefing is withheld — nothing substitutes for it.
[system1]
enabled = false
# bundle_dir = "~/.cria/models/system1/expanded-v2"   # REQUIRED when enabled; never searched for
# threads = 6                                          # CPU intra-op threads (positive integer)

[engagement]
bias = "task"                      # unsure classifier → task | simple | question
# THE ENGAGEMENT LADDER, 0..5, each rung implying every rung below it (the control for "what are the assists
# worth"; out of range is a startup error, never a clamp):
#   0 pure proxy      Responses<->chat wire translation and nothing else (no tool changes, no context surgery,
#                     no loop); the control that measures the protocol gap
#   1 tool-call fixes template repair, dialect recovery, malformed-history argument recovery
#   2 simple tools    cria's tool menu lowered to shell and represented back
#   3 context fixes   the context floor, focus-trim, dedup, compaction reframing
#   4 done refusals   refusing a completion CLAIM (done-critic, completion probe, on-disk brake)
#   5 assists         everything else: steers, periodic gates, the periodic satisfaction check, detectors
# Planning is separate and stays OFF at every level (see [planner]). Omitted = 5. The legacy `drive = true|false`
# is still read (true = 5, false = 0) but is a worse control; write `level`.
level = 5

# Atomic opt-outs for registered assists (only level-eligible ones; unknown, duplicate or still-depended-on IDs are
# startup errors). `profile = "rank4-ablation"` is an exact experimental selection and rejects extra `disabled`.
# See README.md.
# [assists]
# disabled = ["schema-argument-conversion", "historical-argument-recovery"]

[defaults]
base_url = "http://127.0.0.1:18084"   # shared by http backends that omit their own
timeout_seconds = 7200                # one timeout for all backends
# context_window = 49152              # pin n_ctx instead of discovering it from the server's /props.
                                      # Leave unset (or 0) to discover — that is the normal path and
                                      # self-corrects from what the server actually accepts. Set it
                                      # only on a box where /props cannot be read.

# --- Backends: WHERE a model runs. transport = "http" (server) | "cli" (subprocess) ---
[backends.local]
transport = "http"                 # OpenAI-compatible endpoint
base_url = "http://127.0.0.1:18084"   # omit → [defaults].base_url
# api_key_env = "..."              # names the key var; absent = keyless served endpoint
# model = "..."                    # wire model; absent = server's loaded model
# reasoning_style = "openai"       # override. Default: a KEYLESS backend (like this one) gates
                                   # thinking on the chat template (enable_thinking); a KEYED one
                                   # infers from base_url. Naming a style here wins either way.

# [backends.groq]                  # example: keyed remote endpoint
# transport = "http"
# base_url = "https://api.groq.com/openai/v1"
# api_key_env = "GROQ_API_KEY"
# model = "llama-3.3-70b"

# [backends.claude]                # example: CLI subprocess (Claude Code)
# transport = "cli"
# tool = "claude"                  # which CLI
# binary = "claude"                # on PATH, or an absolute path
# cwd = "..."                      # where it runs; omit → cria's cwd

# --- Roles: HOW cria uses a backend. backend + sampling + reasoning ---
# THREE PORTABILITY KNOBS, set per ROLE because cria's backends are ENDPOINTS and the model swaps
# behind them. Every one defaults to the permissive setting, so a template that needs none is
# unaffected — and a template that needs one rejects cria outright without it.
#
#   think_protocol = "chat_template"   how reasoning on/off is expressed. "system_directive" for a
#                                      template with no reasoning switch of its own.
#   collapse_system_prompt = false     true folds cria's system message into the first user turn.
#                                      DeepSeek-R1's distills need it: their template emits the
#                                      system message BARE, before the first user marker, so
#                                      thousands of characters of instruction arrive unframed.
#   merge_consecutive_turns = false    true merges consecutive same-side turns. Meta's Llama
#                                      chat-template lineage raises an exception on the first
#                                      violation, and cria's anchors ARE consecutive user turns —
#                                      measured on Llama-3.1-Nemotron-Nano: the first coder call
#                                      returned 400 twice and the run died in 24 seconds.
#
# See docs/model-settings.md.

[roles.classifier]
backend = "local"                  # names a [backends.*]
reasoning = "on"                   # on | off | auto
temperature = 0.0
top_p = 0.95
top_k = 64
repeat_penalty = 1.1

[roles.reasoner]                   # the planner + the step/task critic
backend = "local"
reasoning = "on"
temperature = 0.6
top_p = 0.95
top_k = 64
repeat_penalty = 1.1

[roles.coder]
backend = "local"
reasoning = "on"
temperature = 0.1
top_p = 0.95
top_k = 64
repeat_penalty = 1.1
# presence_penalty = 0.0          # OpenAI-standard additive presence penalty
output_reserve = 8192              # input-side reserve; keeps a big write_file uncut. It ALSO
#                                  seeds the rumination budget: a turn is aborted once its
#                                  reasoning passes this many tokens, and half of it is the
#                                  warning gate. One knob, two behaviours — raising it for a
#                                  bigger write also gives a spiralling turn longer to spiral.
#                                  An explicit value is yours and is never rescaled with the window, but the
#                                  floor holds at most half the window of it (contextfloor.clamp_reserve), so
#                                  a reserve as large as a small window cannot zero the prompt. Unset, the
#                                  reserve and cria's own size bounds scale with the model's measured window.
# min_p = 0.0                      # sampling floor
# vision = true                    # opt in to image viewing for the role that serves the turn; needs
# vision_model = "<exact wire model id>"   # the pin (docs/image-workflow.md). Unknown = no image POST
# max_tokens = 4096                # HARD output cap; don't set on the coder. On a
#                                  reasoning/judge role it is a CEILING only: an internal
#                                  judgement whose measured budget is higher keeps that budget
#                                  (a cap below it buys zero content), and the raise is logged.
# temp = 0.1                       # alias for temperature

[roles.compactor]
backend = "local"
reasoning = "on"
temperature = 0.6
top_p = 0.95
top_k = 64
repeat_penalty = 1.1

# --- Failover: task_type → ordered role chain ---
# The first RESOLVABLE role serves the call. When that CALL fails (connection refused, 502-504,
# a timeout after its retry-once, 404, 500, exhausted 429s) it walks to the next resolvable role
# on a DIFFERENT endpoint: give that role its own backend base_url (two roles on one server
# share a fate, so the second is dropped). A stream walks only before its first frame; each
# target re-fits the request to its own window; every walk is a `failover.walk` event.
# Loop roles walk the chain named for their job: coder -> coding, reasoner -> reasoning,
# classifier -> classification, compactor -> compaction (add those keys to enable them).
[failover]
coding = ["coder", "reasoner"]     # a role whose backend needs a missing key/binary is skipped
reasoning = ["reasoner"]           # a "question" turn uses this chain, then coding
# classification = ["classifier", "reasoner"]
# compaction = ["compactor", "reasoner"]
