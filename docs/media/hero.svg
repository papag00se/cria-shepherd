    <radialGradient id="halo"><stop stop-color="#0c91ad" stop-opacity=".18"/><stop offset="1" stop-color="#0c91ad" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1275" cy="330" r="360" fill="url(#halo)"/>
  <path d="M1040 0V550M1200 0V550M1360 0V550M1520 0V550M940 130H1600M940 290H1600M940 450H1600" stroke="#b9e6ef" stroke-opacity=".055"/>
  <g font-family="DejaVu Sans, sans-serif">
    <rect x="72" y="66" width="9" height="35" rx="4" fill="#00bddb"/>
