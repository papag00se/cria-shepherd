    <text x="72" y="173" fill="#72ccd9" font-size="22" letter-spacing="4">A LAYER BETWEEN HARNESS AND MODEL</text>
    <text x="65" y="297" fill="#f5f8f9" font-size="105" font-weight="700" letter-spacing="-5">Local models.</text>
    <text x="65" y="410" fill="#f5f8f9" font-size="105" font-weight="700" letter-spacing="-5">Grounded coding<tspan fill="#ffc83e">.</tspan></text>
    <text x="72" y="477" fill="#b7cbd7" font-size="28">Context shaping, tool-call repair and completion checks.</text>
