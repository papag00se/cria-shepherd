<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">cria-shepherd — local models, grounded coding</title>
  <desc id="desc">The cria llama artwork accompanies three areas of work: context shaping, tool-call repair, and completion checks. This is project artwork, not a product screenshot.</desc>
