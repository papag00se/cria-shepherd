[project]
name = "cria-shepherd"
version = "0.0.1"
description = "A harness-agnostic service that makes a small local model do real agentic coding."
requires-python = ">=3.11"          # tomllib
# PyYAML parses structured specs; the CPU runtime and tokenizer serve the trained System 1 model.
dependencies = ["PyYAML>=6", "onnxruntime==1.31.0", "tokenizers==0.23.3"]

[project.optional-dependencies]
# Compatibility extra for existing installations; these dependencies are also in the base install.
system1 = ["onnxruntime==1.31.0", "tokenizers==0.23.3"]

[project.scripts]
cria = "cria.__main__:main"
cria-tail = "cria.tail:main"

# A release is the cria package and its actual prompt resources, not local runs or suite data.
[tool.setuptools.packages.find]
include = ["cria", "cria.*"]

[tool.setuptools.package-data]
"cria.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
